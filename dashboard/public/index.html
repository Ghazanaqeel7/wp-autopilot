<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0d12">
  <title>WP Autopilot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d12'/%3E%3Cpath d='M9 22l7-13 7 13' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M12.5 17.5h7' stroke='%2333b38a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card" novalidate>
      <div class="logo"><span class="logo-mark" aria-hidden="true"></span><span>WP Autopilot</span></div>
      <div>
        <h1 class="login-title">Sign in</h1>
        <p class="muted">Operations console for your WordPress sites.</p>
      </div>
      <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required autofocus></label>
      <button class="btn btn-primary btn-block" type="submit">Continue</button>
      <p class="form-error" id="login-err" role="alert"></p>
    </form>
  </div>

  <div id="app" class="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="logo" href="#/"><span class="logo-mark" aria-hidden="true"></span><span>WP Autopilot</span></a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="overview"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10.5 10 4l7 6.5V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1z"/></svg>Overview</a>
        <a href="#/sites" data-nav="sites"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M3 8h14"/></svg>Sites</a>
        <a href="#/requests" data-nav="requests"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h7l3 3v11H5z"/><path d="M8 9h4M8 12h4"/></svg>Requests<span class="nav-count" id="nav-count" hidden></span></a>
        <a href="#/inbox" data-nav="inbox"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 11h4l1 2h4l1-2h4"/><path d="M3 11 5 4h10l2 7v5H3z"/></svg>Inbox<span class="nav-count" id="inbox-count" hidden></span></a>
        <a href="#/connections" data-nav="connections"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 12 12 8M7 7 5.5 8.5a3 3 0 0 0 4.2 4.2L11 11.5M13 13l1.5-1.5a3 3 0 0 0-4.2-4.2L9 8.5"/></svg>Connections</a>
        <a href="#/activity" data-nav="activity"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10h3l2-5 4 10 2-5h3"/></svg>Activity</a>
        <a href="#/settings" data-nav="settings"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>Settings</a>
      </nav>
      <div class="sidebar-foot">
        <div class="system-state" id="system-state"></div>
        <button class="btn-ghost" id="logout">Sign out</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu" aria-label="Open menu"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="topbar-actions">
          <label class="search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5"/><path d="m13 13 4 4"/></svg>
            <input id="search" type="search" placeholder="Search sites and requests" aria-label="Search"></label>
          <a class="btn btn-primary" href="#/new-request">New request</a>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
