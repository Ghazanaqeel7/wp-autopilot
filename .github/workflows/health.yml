name: Health check
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"   # daily 07:17 PKT
concurrency: { group: autopilot-state, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AP_SIGNING_KEY: ${{ secrets.AP_SIGNING_KEY }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      EMAIL_WEBHOOK_URL: ${{ secrets.EMAIL_WEBHOOK_URL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
      TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
      CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: |
          rc=0; python tools/runner.py health || rc=$?
          tools/commit.sh "autopilot: health"
          exit $rc
