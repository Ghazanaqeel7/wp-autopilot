name: Health check
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"   # daily 07:17 PKT
concurrency: { group: autopilot-state, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AP_SIGNING_KEY: ${{ secrets.AP_SIGNING_KEY }}
      AP_KEY_ID: ${{ secrets.AP_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: |
          rc=0; python tools/runner.py health || rc=$?
          tools/commit.sh "autopilot: health"
          exit $rc
