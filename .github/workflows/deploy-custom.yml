name: Deploy custom site (Cloudflare Pages)
# For sites with site.json -> kind: "custom" (non-WordPress, see docs/CUSTOM_AND_LOCAL_SITES.md).
# Builds live in sites/<site>/build/. Three modes via workflow_dispatch, mirroring the
# WordPress Bridge pipeline's stage → QA → promote/rollback:
#   stage    (default) — deploy to a PREVIEW Pages branch, run QA (Lighthouse + Playwright
#            checks against the same thresholds as WordPress sites), write qa.json + the
#            per-request preview.json, and set status preview_ready/qa_failed.
#   promote  — redeploy the current build to the LIVE Pages branch (only after QA passed —
#              this is what the dashboard's "Approve & publish" button triggers).
#   rollback — redeploy the previous live commit's build to the LIVE Pages branch.
# A plain push to main with no site chosen (legacy/ad-hoc) still deploys straight to each
# custom site's live branch with no staging gate — use workflow_dispatch for anything that
# should go through QA and review first.
on:
  workflow_dispatch:
    inputs:
      site: { description: "Site id (folder under sites/)", required: true }
      request: { description: "Request id, e.g. R20261114-002", required: false }
      mode:
        description: What to do
        type: choice
        options: [stage, promote, rollback]
        default: stage
  push:
    branches: [main]
    paths: ["sites/*/build/**"]
concurrency: { group: "deploy-custom-${{ github.event.inputs.site || 'auto' }}", cancel-in-progress: false }
permissions: { contents: write }
jobs:
  legacy-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: wp-autopilot
    steps:
      - uses: actions/checkout@v4
      - name: Resolve changed site(s)
        id: sites
        run: |
          list=""
          for d in sites/*/build; do
            [ -d "$d" ] || continue
            s=$(basename "$(dirname "$d")")
            kind=$(python3 -c "import json;print(json.load(open('sites/$s/site.json')).get('kind','wordpress-bridge'))" 2>/dev/null || echo "")
            [ "$kind" = "custom" ] && list="$list $s"
          done
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: Install wrangler
        run: npm install -g wrangler@latest
      - name: Deploy each site to its live Pages branch
        run: |
          for s in ${{ steps.sites.outputs.list }}; do
            echo "::group::Deploying $s"
            out=$(wrangler pages deploy "sites/$s/build" --project-name "$PAGES_PROJECT" --branch "$s" --commit-dirty=true 2>&1 | tee /tmp/deploy-$s.log)
            url=$(echo "$out" | grep -Eo 'https://[a-z0-9.-]*\.pages\.dev' | tail -1)
            [ -z "$url" ] && { echo "::error::Could not parse a deploy URL for $s"; cat /tmp/deploy-$s.log; exit 1; }
            mkdir -p "reports/$s/latest"
            python3 -c 'import sys,json; json.dump({"url":sys.argv[2],"expires":None}, open(f"reports/{sys.argv[1]}/latest/preview.json","w"), indent=2)' "$s" "$url"
            git rev-parse HEAD > "reports/$s/live-commit.txt"
            echo "::endgroup::"
          done
      - name: Commit
        run: |
          git config user.name "wp-autopilot[bot]"; git config user.email "wp-autopilot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -qm "deploy: custom site preview link(s)"
          git pull -q --rebase origin main && git push -q origin HEAD:main || true

  stage:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'stage'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: wp-autopilot
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { qa: "true" }
      - name: Install wrangler
        run: npm install -g wrangler@latest
      - name: Deploy to preview branch
        id: deploy
        run: |
          s="${{ inputs.site }}"
          out=$(wrangler pages deploy "sites/$s/build" --project-name "$PAGES_PROJECT" --branch "${s}-preview" --commit-dirty=true 2>&1 | tee /tmp/deploy.log)
          url=$(echo "$out" | grep -Eo 'https://[a-z0-9.-]*\.pages\.dev' | tail -1)
          [ -z "$url" ] && { echo "::error::Could not parse a deploy URL"; cat /tmp/deploy.log; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Stage → QA → finalize
        run: |
          req="${{ inputs.request }}"; [ -z "$req" ] && req="latest"
          python tools/runner.py stage_custom "${{ inputs.site }}" "$req" "${{ steps.deploy.outputs.url }}"
          python tools/qa_custom.py || echo "qa crashed"
          python tools/runner.py finalize_custom "${{ inputs.site }}" "$req"
      - name: Commit reports
        if: always()
        run: tools/commit.sh "autopilot: staged ${{ inputs.site }}/${{ inputs.request }} (custom)"

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: wp-autopilot
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install wrangler
        run: npm install -g wrangler@latest
      - name: Deploy current build to the live branch
        id: deploy
        run: |
          s="${{ inputs.site }}"
          prev=""; [ -f "reports/$s/live-commit.txt" ] && prev=$(cat "reports/$s/live-commit.txt")
          out=$(wrangler pages deploy "sites/$s/build" --project-name "$PAGES_PROJECT" --branch "$s" --commit-dirty=true 2>&1 | tee /tmp/deploy.log)
          url=$(echo "$out" | grep -Eo 'https://[a-z0-9.-]*\.pages\.dev' | tail -1)
          [ -z "$url" ] && { echo "::error::Could not parse a deploy URL"; cat /tmp/deploy.log; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"; echo "prev=$prev" >> "$GITHUB_OUTPUT"
          mkdir -p "reports/$s/latest"
          python3 -c 'import sys,json; json.dump({"url":sys.argv[2],"expires":None}, open(f"reports/{sys.argv[1]}/latest/preview.json","w"), indent=2)' "$s" "$url"
          git rev-parse HEAD > "reports/$s/live-commit.txt"
      - name: Record approval
        run: python tools/runner.py promote_custom "${{ inputs.site }}" "${{ inputs.request }}" "${{ steps.deploy.outputs.prev }}"
      - name: Commit
        if: always()
        run: tools/commit.sh "autopilot: ${{ inputs.site }}/${{ inputs.request }} is LIVE (custom)"

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: wp-autopilot
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - name: Find the previous live commit
        id: prev
        run: |
          sha=$(python tools/runner.py rollback_custom "${{ inputs.site }}" "${{ inputs.request }}" | tail -1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Install wrangler
        run: npm install -g wrangler@latest
      - name: Redeploy that build to the live branch
        run: |
          s="${{ inputs.site }}"; sha="${{ steps.prev.outputs.sha }}"
          rm -rf /tmp/rollback-build && mkdir -p /tmp/rollback-build
          git archive "$sha" -- "sites/$s/build" | tar -x -C /tmp/rollback-build
          out=$(wrangler pages deploy "/tmp/rollback-build/sites/$s/build" --project-name "$PAGES_PROJECT" --branch "$s" --commit-dirty=true 2>&1 | tee /tmp/deploy.log)
          url=$(echo "$out" | grep -Eo 'https://[a-z0-9.-]*\.pages\.dev' | tail -1)
          [ -z "$url" ] && { echo "::error::Could not parse a deploy URL"; cat /tmp/deploy.log; exit 1; }
          mkdir -p "reports/$s/latest"
          python3 -c 'import sys,json; json.dump({"url":sys.argv[2],"expires":None}, open(f"reports/{sys.argv[1]}/latest/preview.json","w"), indent=2)' "$s" "$url"
          echo "$sha" > "reports/$s/live-commit.txt"
      - name: Commit
        if: always()
        run: tools/commit.sh "autopilot: ${{ inputs.site }}/${{ inputs.request }} rolled back (custom)"
