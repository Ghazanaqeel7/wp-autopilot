name: Autopilot setup
description: Python deps (+ optional browser QA tools)
inputs:
  qa:
    description: Install Playwright Chromium and Lighthouse
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: tools/requirements.txt
    - shell: bash
      run: pip install -q -r tools/requirements.txt
    - if: inputs.qa == 'true'
      shell: bash
      run: |
        pip install -q playwright==1.48.0
        python -m playwright install --with-deps chromium
        npm install -g --silent lighthouse@12
