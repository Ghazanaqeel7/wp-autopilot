name = "wp-autopilot"
main = "dashboard/worker.js"
compatibility_date = "2026-11-01"
keep_vars = true  # never wipe variables set in the Cloudflare dashboard on redeploy

[assets]
directory = "dashboard/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
GITHUB_REPO = "Ghazanaqeel7/wp-autopilot"

# Encrypted store for the tokens saved on the Connections page. No id: Cloudflare creates it on first deploy.
[[kv_namespaces]]
binding = "CONNECTIONS"
