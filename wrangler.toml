name = "wp-autopilot"
main = "dashboard/worker.js"
compatibility_date = "2026-11-01"
keep_vars = true  # never wipe variables set in the Cloudflare dashboard on redeploy

[assets]
directory = "dashboard/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
GITHUB_REPO = "Ghazanaqeel7/wp-autopilot"
